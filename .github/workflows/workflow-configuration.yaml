on:
  push:
    branches:
      - "**" # Runs on every branch push
  pull_request:
    branches:
      - main

jobs:
  automated-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.2"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          # Dummy value: satisfies the Agent's key check at construction time.
          # Tests never call the LLM, so a real key isn't needed here.
          GOOGLE_API_KEY: dummy-key-for-ci
        run: |
          PYTHONPATH=. pytest -s -v
